name: Bug report / 缺陷报告
description: Report a reproducible problem using synthetic data only. 仅使用虚构数据报告可复现问题。
title: "bug: "
body:
  - type: markdown
    attributes:
      value: Do not include real project, business, organization, personal, credential, address, screenshot, log, or test data. 禁止包含真实项目、业务、组织、个人、凭据、地址、截图、日志或测试数据。
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior / 实际现象
      description: Use a generic or synthetic example. 请使用通用或虚构示例。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction / 复现步骤
      description: Provide the smallest synthetic reproduction. 请提供最小虚构复现。
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Repository hygiene / 仓库卫生确认
      options:
        - label: I confirm this report contains synthetic, non-identifying information only. 我确认本报告只包含虚构且不可识别的信息。
          required: true
