name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:hygiene
        env:
          REPOSITORY_HYGIENE_DENYLIST: ${{ secrets.REPOSITORY_HYGIENE_DENYLIST }}
      - run: npm test
      - run: npm run test:e2e
        if: runner.os == 'Windows'
